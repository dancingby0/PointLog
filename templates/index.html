<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PointLog</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
{% raw %}
<main class="wrap" id="app">
  <h1>PointLog</h1>

  <section class="today">
    <div class="points">{{ selectedLabel }} 点数 <strong>{{ dayPoints }}</strong></div>
  </section>

  <!-- 日期切换器（git log 风格） -->
  <section class="card day-picker">
    <div class="day-picker-head">
      <h2>日期切换</h2>
      <div class="day-controls">
        <input v-model="jumpTo" type="date" @change="jumpToDay" title="跳转到某天">
        <button type="button" class="ghost" @click="goToday" :disabled="selectedIsToday">回到今天</button>
      </div>
    </div>
    <ul class="day-list">
      <li v-for="d in days" :key="d.date"
          class="day-item" :class="{ active: d.date === selectedDay }"
          @click="selectDay(d.date)">
        <span class="day-date">{{ d.date }}</span>
        <span class="day-week">{{ weekdayLabel(d.date) }}</span>
        <span class="day-tag" v-if="d.is_today">今天</span>
        <span class="day-points">{{ d.points }} 点</span>
      </li>
    </ul>
  </section>

  <form class="card" @submit.prevent="submit">
    <h2>{{ editingId ? '编辑打卡' : '新增打卡' }}</h2>
    <label>做什么（一句话）
      <input v-model.trim="form.content" type="text" maxlength="100" placeholder="例：背完《岳阳楼记》">
    </label>
    <label>点数
      <input v-model.number="form.points" type="number" min="0" step="1" placeholder="1">
    </label>
    <label>类别（可选）
      <input v-model.trim="form.category" type="text" maxlength="20" placeholder="例：语文 / 运动">
    </label>
    <label>时间（默认：{{ selectedIsToday ? '现在' : selectedDay + ' 12:00' }}，凌晨4点前算昨日）
      <input v-model="form.ts" type="datetime-local">
    </label>
    <button type="submit">{{ editingId ? '保存修改' : '提交' }}</button>
    <button type="button" class="ghost" v-if="editingId" @click="endEdit">取消编辑</button>
  </form>

  <section class="card">
    <h2>{{ selectedLabel }} 的记录</h2>
    <p v-if="sortedEntries.length === 0" class="muted">这一天还没有记录。</p>
    <ul v-else class="entry-list">
      <li v-for="e in sortedEntries" :key="e.id" class="entry">
        <span class="entry-time">{{ formatTime(e.ts) }}</span>
        <span class="entry-content">{{ e.content }}</span>
        <span v-if="e.category" class="entry-cat">{{ e.category }}</span>
        <span class="entry-points">+{{ e.points }}</span>
        <button class="edit" @click="startEdit(e)">编辑</button>
        <button class="delete" @click="del(e)">×</button>
      </li>
    </ul>
  </section>
</main>
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/app.js"></script>
{% endraw %}
</body>
</html>
