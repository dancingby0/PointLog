<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PointLog</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
{% raw %}
<main class="wrap" id="app">
  <h1>PointLog</h1>

  <section class="today">
    <div class="points">今日点数 <strong>{{ todayPoints }}</strong></div>
  </section>

  <form class="card" @submit.prevent="submit">
    <h2>{{ editingId ? '编辑打卡' : '新增打卡' }}</h2>
    <label>做什么（一句话）
      <input v-model.trim="form.content" type="text" maxlength="100" placeholder="例：背完《岳阳楼记》">
    </label>
    <label>点数
      <input v-model.number="form.points" type="number" min="0" step="1" placeholder="1">
    </label>
    <label>类别（可选）
      <input v-model.trim="form.category" type="text" maxlength="20" placeholder="例：语文 / 运动">
    </label>
    <label>时间（可选，默认现在）
      <input v-model="form.ts" type="datetime-local">
    </label>
    <button type="submit">{{ editingId ? '保存修改' : '提交' }}</button>
    <button type="button" class="ghost" v-if="editingId" @click="endEdit">取消编辑</button>
  </form>

  <section class="card">
    <h2>今天的记录</h2>
    <p v-if="sortedEntries.length === 0" class="muted">今天还没有记录。</p>
    <ul v-else class="entry-list">
      <li v-for="e in sortedEntries" :key="e.id" class="entry">
        <span class="entry-time">{{ formatTime(e.ts) }}</span>
        <span class="entry-content">{{ e.content }}</span>
        <span v-if="e.category" class="entry-cat">{{ e.category }}</span>
        <span class="entry-points">+{{ e.points }}</span>
        <button class="edit" @click="startEdit(e)">编辑</button>
        <button class="delete" @click="del(e)">×</button>
      </li>
    </ul>
  </section>
</main>
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/app.js"></script>
{% endraw %}
</body>
</html>
